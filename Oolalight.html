<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oola - Presupuesto Combinado (Modo Ligero)</title>
    <!-- Fuente Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        /* ESTILOS PARA WEBKIT ANTIGUO (2010 - 2013) */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0d14; /* Color oscuro sobrio fijo */
            color: #e0e6ed;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* Capa del Intro */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0d14;
            /* Degradado de respaldo */
            background: -webkit-radial-gradient(center, ellipse cover, #121622 0%, #0b0d14 70%);
            background: radial-gradient(circle at center, #121622 0%, #0b0d14 70%);
            z-index: 9999;
            /* Flexbox WebKit antiguo */
            display: -webkit-box;
            display: box;
            -webkit-box-orient: vertical;
            box-orient: vertical;
            -webkit-box-pack: center;
            box-pack: center;
            -webkit-box-align: center;
            box-align: center;
            overflow: hidden;
            -webkit-transition: opacity 0.8s ease-in-out, visibility 0.8s ease-in-out;
            transition: opacity 0.8s ease-in-out, visibility 0.8s ease-in-out;
            cursor: pointer;
        }

        .hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Marca de Agua */
        .watermark-container {
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            z-index: 0;
            pointer-events: none;
            /* Centrado simple */
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-box-pack: center;
            -webkit-box-align: center;
            -webkit-transform: rotate(-20deg);
            transform: rotate(-20deg);
            -webkit-animation: moveWatermark 120s linear infinite;
            animation: moveWatermark 120s linear infinite;
        }

        @-webkit-keyframes moveWatermark {
            0% { -webkit-transform: rotate(-20deg) translate(0, 0); }
            100% { -webkit-transform: rotate(-20deg) translate(-15%, -15%); }
        }

        .watermark-row {
            display: block;
            white-space: nowrap;
            width: 100%;
            margin: 15px 0;
        }

        .watermark-row.odd {
            -webkit-animation: slideLeft 100s linear infinite;
            animation: slideLeft 100s linear infinite;
        }

        .watermark-row.even {
            -webkit-animation: slideRight 100s linear infinite;
            animation: slideRight 100s linear infinite;
        }

        @-webkit-keyframes slideLeft {
            0% { -webkit-transform: translateX(0); }
            100% { -webkit-transform: translateX(-20%); }
        }

        @-webkit-keyframes slideRight {
            0% { -webkit-transform: translateX(-20%); }
            100% { -webkit-transform: translateX(0); }
        }

        .watermark-text {
            font-size: 2rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.02);
            display: inline-block;
            white-space: pre;
            -webkit-user-select: none;
            user-select: none;
            letter-spacing: 0.05em;
        }

        /* Contenido Principal del Intro */
        .intro-content {
            position: relative;
            z-index: 1;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-box-align: center;
            text-align: center;
        }

        /* Imagotipo */
        .imagotype {
            width: 90px;
            height: 90px;
            margin-bottom: 30px;
            opacity: 0;
            -webkit-animation: fadeInImagotype 2s ease-out 0.5s forwards, float 5s ease-in-out 2.5s infinite;
            animation: fadeInImagotype 2s ease-out 0.5s forwards, float 5s ease-in-out 2.5s infinite;
        }

        @-webkit-keyframes fadeInImagotype {
            to { opacity: 1; -webkit-transform: translateY(0); }
        }

        @-webkit-keyframes float {
            0% { -webkit-transform: translateY(0px); }
            50% { -webkit-transform: translateY(-15px); }
            100% { -webkit-transform: translateY(0px); }
        }

        /* Animación Letras */
        .logo-container {
            font-size: 6rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            display: block; /* Flexbox block fallback */
        }

        .logo-letter {
            opacity: 0;
            display: inline-block;
            -webkit-transform: translateY(30px) scale(0.8);
            transform: translateY(30px) scale(0.8);
            -webkit-animation-name: revealLetter;
            animation-name: revealLetter;
            -webkit-animation-duration: 1.2s;
            animation-duration: 1.2s;
            -webkit-animation-fill-mode: forwards;
            animation-fill-mode: forwards;
        }

        .logo-letter.highlight {
            color: #00d2ff;
            font-weight: 700;
            text-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
        }

        @-webkit-keyframes revealLetter {
            to { opacity: 1; -webkit-transform: translateY(0) scale(1); }
        }

        /* CTA */
        .call-to-action {
            position: absolute;
            bottom: 50px;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.5);
            -webkit-animation: pulseCTA 2.5s infinite;
            animation: pulseCTA 2.5s infinite;
            text-transform: uppercase;
            z-index: 2;
            pointer-events: none;
            width: 100%;
            text-align: center;
        }

        @-webkit-keyframes pulseCTA {
            0%, 100% { opacity: 0.2; -webkit-transform: scale(0.98); }
            50% { opacity: 0.8; -webkit-transform: scale(1); }
        }

        /* Contenido de Prueba (La app detrás) */
        #app-content {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-box-pack: center;
            -webkit-box-align: center;
            height: 100%;
            text-align: center;
            padding: 20px;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
        }

        #app-content h1 { color: #00d2ff; margin-bottom: 10px; }
        #app-content p { color: #8892b0; max-width: 600px; line-height: 1.6; margin: 0 auto; }
        
        .reset-btn {
            margin-top: 30px;
            padding: 10px 20px;
            background: transparent;
            border: 1px solid #00d2ff;
            color: #00d2ff;
            border-radius: 5px;
            cursor: pointer;
            -webkit-transition: all 0.3s ease;
        }
    </style>
</head>

<body>
    <!-- Capa del Intro -->
    <div id="intro-overlay">
        <!-- Contenedor de Marca de Agua -->
        <div class="watermark-container" id="watermark-container"></div>

        <div class="intro-content">
            <!-- Imagotipo -->
            <svg class="imagotype" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 10 L85 30 L85 70 L50 90 L15 70 L15 30 Z" stroke="#00d2ff" stroke-width="2.5" stroke-linejoin="round" />
                <path d="M50 10 L50 50 M85 30 L50 50 M15 30 L50 50 M85 70 L50 50 M15 70 L50 50 M50 90 L50 50" stroke="#00d2ff" stroke-width="1" stroke-opacity="0.5" />
                <circle cx="50" cy="50" r="8" fill="#00d2ff" />
                <circle cx="50" cy="50" r="4" fill="#ffffff" />
            </svg>

            <!-- Contenedor del Logo -->
            <div class="logo-container" id="logo-container"></div>
        </div>

        <div class="call-to-action">Toca o presiona Enter para continuar</div>
    </div>

    <!-- Contenedor de la Aplicación Principal -->
    <div id="app-content">
        <h1>Presupuesto Combinado (Light)</h1>
        <p>Estás en la versión Light optimizada para WebKit Antiguo (2010-2013).</p>
        <button class="reset-btn" onclick="sessionStorage.removeItem('introSeenLight'); location.reload();">Reiniciar Intro Light</button>
    </div>

    <script>
        // MODO ES5 ESTRICTO PARA MÁXIMA COMPATIBILIDAD (2010 - 2013)
        (function() {
            // Función auxiliar para document.ready en navegadores muy viejos
            function domReady(fn) {
                if (document.readyState === "complete" || document.readyState === "interactive") {
                    setTimeout(fn, 1);
                } else {
                    document.addEventListener("DOMContentLoaded", fn, false);
                }
            }

            domReady(function() {
                var introOverlay = document.getElementById('intro-overlay');
                var watermarkContainer = document.getElementById('watermark-container');
                var logoContainer = document.getElementById('logo-container');

                // 1. Verificar sessionStorage
                var isIntroSeen = null;
                try { 
                    isIntroSeen = sessionStorage.getItem('introSeenLight'); 
                } catch (e) {}
                
                if (isIntroSeen === 'true') {
                    introOverlay.style.display = 'none';
                    document.body.style.overflow = 'auto'; 
                    return; 
                }

                // Generar Criptex optimizado (Menos filas e iteraciones para no saturar memoria RAM antigua)
                function initIntro(phrases) {
                    var randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
                    var watermarkText = 'Oola - ' + randomPhrase.toUpperCase() + '    ';

                    var watermarkHTML = '';
                    var rowsCount = 10; // Menos filas para Android 2013
                    var repsCount = 10; // Menos columnas
                    
                    for (var r = 0; r < rowsCount; r++) {
                        var rowClass = (r % 2 === 0) ? 'even' : 'odd';
                        watermarkHTML += '<div class="watermark-row ' + rowClass + '">';
                        for (var i = 0; i < repsCount; i++) {
                            // Aplicar un color alternativo sutil a pares si se desea
                            var colorStyle = (i % 2 === 0) ? '' : 'color: rgba(0, 210, 255, 0.015);';
                            watermarkHTML += '<span class="watermark-text" style="' + colorStyle + '">' + watermarkText + '</span>';
                        }
                        watermarkHTML += '</div>';
                    }
                    watermarkContainer.innerHTML = watermarkHTML;

                    // Preparar Animación del Logo "Oola"
                    var logoText = "Oola";
                    var logoHTML = '';
                    var baseDelays = [];
                    for (var j = 0; j < logoText.length; j++) {
                        // Delay fijo para evitar funciones asíncronas pesadas o simplemente aleatorio
                        baseDelays.push((Math.random() * 1.0 + 0.4).toFixed(2));
                    }

                    for (var k = 0; k < logoText.length; k++) {
                        var char = logoText[k];
                        var extraClass = (k === 0) ? 'highlight' : '';
                        var delayStyle = '-webkit-animation-delay: ' + baseDelays[k] + 's; animation-delay: ' + baseDelays[k] + 's;';
                        logoHTML += '<span class="logo-letter ' + extraClass + '" style="' + delayStyle + '">' + char + '</span>';
                    }
                    logoContainer.innerHTML = logoHTML;
                }

                // Carga usando XMLHttpRequest puro (Soporte asegurado 2010+)
                function loadJSON() {
                    var xhr = new XMLHttpRequest();
                    xhr.onreadystatechange = function() {
                        if (xhr.readyState === 4) {
                            if (xhr.status === 200 || xhr.status === 0) {
                                try {
                                    var data = JSON.parse(xhr.responseText);
                                    initIntro(data);
                                } catch(e) { 
                                    initIntro(["Gestión inteligente"]); 
                                }
                            } else {
                                initIntro(["Gestión inteligente"]);
                            }
                        }
                    };
                    xhr.open("GET", "frases.json", true);
                    xhr.send();
                }

                loadJSON();

                // Lógica de descarte de intro
                var isDismissing = false;
                var dismissIntro = function() {
                    if (isDismissing) return;
                    isDismissing = true;
                    
                    introOverlay.className += ' hidden'; 
                    document.body.style.overflow = 'auto'; 
                    
                    try { 
                        sessionStorage.setItem('introSeenLight', 'true'); 
                    } catch(e) {}
                    
                    setTimeout(function() {
                        if (introOverlay.parentNode) {
                            introOverlay.parentNode.removeChild(introOverlay);
                        }
                    }, 800);
                };

                // Eventos
                introOverlay.addEventListener('click', dismissIntro, false);
                document.addEventListener('touchstart', dismissIntro, false); // Simplificado para touch antiguo
                
                document.addEventListener('keydown', function(e) {
                    if (introOverlay.className.indexOf('hidden') === -1) {
                        if (e.keyCode === 13 || e.keyCode === 32) {
                            dismissIntro();
                        }
                    }
                }, false);
            });
        })();
    </script>
</body>

</html>
